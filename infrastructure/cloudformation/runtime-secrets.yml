AWSTemplateFormatVersion: "2010-09-09"
Description: SignalTrade environment-scoped runtime Secret containers

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]

Resources:
  CommonSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "signaltrade/${Environment}/common"
      Description: !Sub "SignalTrade ${Environment} shared runtime configuration"
      SecretString: "{}"
  IdentitySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "signaltrade/${Environment}/identity"
      Description: !Sub "SignalTrade ${Environment} identity credentials"
      SecretString: "{}"
  NotificationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "signaltrade/${Environment}/notification"
      Description: !Sub "SignalTrade ${Environment} notification credentials"
      SecretString: "{}"
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "signaltrade/${Environment}/database"
      Description: !Sub "SignalTrade ${Environment} database connection"
      SecretString: "{}"

Outputs:
  CommonSecretArn: {Value: !Ref CommonSecret}
  IdentitySecretArn: {Value: !Ref IdentitySecret}
  NotificationSecretArn: {Value: !Ref NotificationSecret}
  DatabaseSecretArn: {Value: !Ref DatabaseSecret}
