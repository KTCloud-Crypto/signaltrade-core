AWSTemplateFormatVersion: "2010-09-09"
Description: SignalTrade staging External Secrets least-privilege access

Parameters:
  ExternalSecretsRoleName:
    Type: String
    Default: signaltrade-staging-external-secrets

Resources:
  StagingSecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SignalTradeStagingSecretRead
      Roles: [!Ref ExternalSecretsRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:signaltrade/staging/*"
          - Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/signaltrade/staging/monitoring/*"

Outputs:
  PolicyName:
    Value: !Ref StagingSecretReadPolicy
