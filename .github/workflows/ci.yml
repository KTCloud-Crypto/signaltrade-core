name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/signaltrade-core/pyproject.toml
      - run: pip install -e "packages/signaltrade-core[dev]"
      - run: pytest -q packages/signaltrade-core/tests
      - run: docker build -t signaltrade-migrations:ci database
