name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install cfn-lint
      - run: cfn-lint infrastructure/cloudformation/*.yml

  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signaltrade
          POSTGRES_PASSWORD: signaltrade
          POSTGRES_DB: signaltrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signaltrade -d signaltrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/signaltrade-core/pyproject.toml
      - run: pip install -e "packages/signaltrade-core[dev]"
      - run: pytest -q packages/signaltrade-core/tests
      - run: docker build -t signaltrade-migrations:ci database
      - name: Verify a single Alembic head
        run: test "$(docker run --rm signaltrade-migrations:ci heads | wc -l)" -eq 1
      - name: Apply all migrations to PostgreSQL
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://signaltrade:signaltrade@127.0.0.1:5432/signaltrade \
            signaltrade-migrations:ci upgrade head
      - name: Verify migration reached head
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://signaltrade:signaltrade@127.0.0.1:5432/signaltrade \
            signaltrade-migrations:ci current | grep --quiet '(head)'

  publish-staging-migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [validate-cloudformation, test-and-migrate]
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "arn:aws:iam::832496385575:role/signaltrade-staging-github-migrations-ecr", aws-region: us-east-1}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: database
          push: true
          tags: "832496385575.dkr.ecr.us-east-1.amazonaws.com/signaltrade/migrations:${{ github.sha }}"
      - name: Request staging migration deployment
        env:
          GITOPS_DISPATCH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GITOPS_DISPATCH_TOKEN" ]]; then
            echo "::warning::GITOPS_DISPATCH_TOKEN is not configured; image was published but not promoted."
            exit 0
          fi
          jq -n --arg service "migrations" --arg tag "${{ github.sha }}" \
            '{event_type:"promote-staging-image",client_payload:{service:$service,tag:$tag}}' \
            | curl --fail-with-body --request POST \
                --header "Authorization: Bearer $GITOPS_DISPATCH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/KTCloud-Crypto/signaltrade-gitops/dispatches \
                --data-binary @-
