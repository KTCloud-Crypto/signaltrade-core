apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: signaltrade-prometheus}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, pods, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: signaltrade-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: signaltrade-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: signaltrade}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alloy}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: signaltrade-alloy}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: signaltrade-alloy}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: signaltrade-alloy}
subjects: [{kind: ServiceAccount, name: alloy, namespace: signaltrade}]
