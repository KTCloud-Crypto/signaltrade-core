apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels: {app.kubernetes.io/name: node-exporter, app.kubernetes.io/part-of: signaltrade}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: node-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: node-exporter, app.kubernetes.io/part-of: signaltrade}}
    spec:
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.11.1
          args: [--path.rootfs=/host, '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)']
          ports: [{name: metrics, containerPort: 9100}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts: [{name: root, mountPath: /host, readOnly: true, mountPropagation: HostToContainer}]
      volumes:
        - name: root
          hostPath: {path: /}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels: {app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: signaltrade}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: signaltrade}}
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.18.1
          command: [/bin/sh, -c]
          args: ['export DATA_SOURCE_NAME="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"; exec /bin/postgres_exporter']
          envFrom: [{secretRef: {name: postgres-secret}}]
          ports: [{name: metrics, containerPort: 9187}]
          readinessProbe: {httpGet: {path: /metrics, port: metrics}}
          livenessProbe: {httpGet: {path: /metrics, port: metrics}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: postgres-exporter}
spec:
  selector: {app.kubernetes.io/name: postgres-exporter}
  ports: [{name: metrics, port: 9187, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: signaltrade}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kube-state-metrics}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: signaltrade}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          readinessProbe: {httpGet: {path: /readyz, port: telemetry}}
          livenessProbe: {httpGet: {path: /healthz, port: telemetry}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics}
spec:
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
